<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Claude Code and Grok Bot agents talking through each vendor's own routine endpoints, no middleware">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6d6d6"/></marker>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#C15F3C"/></linearGradient>
    <linearGradient id="gk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#000000"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .t { font-size: 30px; font-weight: 700; fill: #fff; }
    .s { font-size: 16px; fill: rgba(255,255,255,.82); }
    .l { font-size: 15px; font-weight: 600; fill: #f2f2f2; }
    .m { font-size: 13px; fill: #a8a8a8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .c { font-size: 14px; font-weight: 700; fill: #f2f2f2; letter-spacing: .08em; }
  </style>
  <rect x="40" y="70" width="330" height="240" rx="28" fill="url(#cc)"/>
  <text class="t" x="72" y="138">Claude Code</text>
  <text class="s" x="72" y="170">your coding sessions,</text>
  <text class="s" x="72" y="194">local or in the cloud</text>
  <text class="s" x="72" y="268">skill: grok-bridge</text>
  <rect x="830" y="70" width="330" height="240" rx="28" fill="url(#gk)"/>
  <text class="t" x="862" y="138">Grok Bot</text>
  <text class="s" x="862" y="170">your agents: Chief of Staff,</text>
  <text class="s" x="862" y="194">reviewers, ops, ...</text>
  <text class="s" x="862" y="268">plugin: Claude Code</text>
  <path d="M390 150 H810" stroke="#d6d6d6" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text class="l" x="600" y="132" text-anchor="middle">question  ·  request  ·  note</text>
  <text class="m" x="600" y="176" text-anchor="middle">Grok routine webhook</text>
  <path d="M810 236 H390" stroke="#d6d6d6" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text class="l" x="600" y="218" text-anchor="middle">answer, pushed into the session</text>
  <text class="m" x="600" y="262" text-anchor="middle">Claude Code routine fire API</text>
  <rect x="487" y="300" width="226" height="34" rx="17" fill="none" stroke="#d6d6d6" stroke-width="1.5"/>
  <text class="c" x="600" y="322" text-anchor="middle">NO MIDDLEWARE</text>
</svg>
